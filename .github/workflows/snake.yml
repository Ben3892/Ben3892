name: Update contribution graphics

on:
  schedule:
    # 02:17 UTC / 10:17 Asia/Shanghai, once a day.
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/snake.yml
      - scripts/render_activity.py

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Fetch public contribution calendar and render activity graphs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$PROFILE_USER" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    weeks { contributionDays { contributionCount date } }
                  }
                }
              }
            }' > "$RUNNER_TEMP/contributions.json"
          python3 scripts/render_activity.py --input "$RUNNER_TEMP/contributions.json" --username "$PROFILE_USER"

      - name: Generate light and dark SVG animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit updated graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity*.svg assets/github-contribution-grid-snake*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update contribution graphics"
          git push origin HEAD:main
