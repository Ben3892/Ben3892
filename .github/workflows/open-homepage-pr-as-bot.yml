name: Open homepage update as bot

on:
  push:
    branches:
      - 'codex/pr/homepage-*'

permissions:
  pull-requests: write

concurrency:
  group: open-pr-as-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    if: github.repository == 'Ben3892/Ben3892' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open a pull request for human review
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/pulls"
          head="$GITHUB_REF_NAME"
          pr=$(gh api --method GET "$endpoint" \
            -f state=open -f "base=$BASE_BRANCH" -f "head=$GITHUB_REPOSITORY_OWNER:$head" \
            --jq '.[] | [.html_url, .user.login] | @tsv')

          if [[ -z "$pr" ]]; then
            body=${COMMIT_MESSAGE#*$'\n'}
            if [[ "$body" == "$COMMIT_MESSAGE" ]]; then
              body="Homepage content update prepared for human review."
            fi
            title=${COMMIT_MESSAGE%%$'\n'*}
            title=${title:-"Changes from $head"}
            pr=$(gh api --method POST "$endpoint" \
              -f "base=$BASE_BRANCH" -f "head=$head" -f "title=${title:0:240}" \
              -f "body=$body" \
              --jq '[.html_url, .user.login] | @tsv')
          fi

          IFS=$'\t' read -r url author <<< "$pr"
          if [[ "$author" != 'github-actions[bot]' ]]; then
            printf 'An open PR already belongs to %s. %s\n' "$author" "$url" >&2
            exit 1
          fi
          printf 'Pull request: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"

